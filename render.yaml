databases:
  - name: astrobook-db
    plan: free
    databaseName: astrobook
    user: astrobook

services:
  - type: web
    name: astrobook-web
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "python manage.py migrate --noinput && gunicorn book_finder.wsgi --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: astrobook-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false  

  - type: web
    name: astrobook-bot
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python bot/bot.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: astrobook-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
